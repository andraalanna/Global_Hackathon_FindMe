<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIND ME! Prototype v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#fff4fb; --bg2:#f6effc; --card:#fff; --line:#efe2f5; --line2:#e4d4ee;
  --ink:#33265a; --navy:#3a2d66; --muted:#6f6488; --faint:#a99cbc;
  --pink:#ff86bd; --pink-d:#df5f9c; --pink-l:#ffe3f0;
  --mint:#55e2a9; --mint-d:#25a873; --mint-l:#dcf9ec;
  --sky:#74c6fb; --sky-l:#e0f2ff;
  --sun:#ffe26a; --sun-l:#fff6cc;
  --lav:#c7b6ff; --lav-l:#efe9ff;
  --head:"Fredoka",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  --st:52px; --sb:18px; --k:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#efe6f6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}

/* stage */
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:20px 16px}
.nav{width:240px;max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:20px;padding:4px 4px 20px}
.nav h1{font-family:var(--head);font-weight:700;font-size:24px;margin:4px 0 2px}
.nav .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.nav h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:800}
.nav button{display:block;width:100%;text-align:left;font-size:13px;font-weight:600;padding:5px 10px;border-radius:9px}
.nav button:hover{background:#fff9}
.nav button.on{background:var(--navy);color:#fff}
.phone{width:390px;height:844px;zoom:var(--k);border-radius:56px;background:#1c1530;padding:12px;box-shadow:0 30px 80px -20px #3a2d6655;flex:none}
.screenwrap{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg)}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font-size:15px;font-weight:800;pointer-events:none;color:var(--ink)}
.statusbar.light{color:#fff}
.statusbar .notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#000}
#app{position:absolute;inset:0}
@media (max-width:640px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}.nav{display:none}
  .phone{width:100%;height:100dvh;zoom:1;border-radius:0;padding:0;box-shadow:none;background:none}
  .screenwrap{border-radius:0}.statusbar{display:none}
  :root{--st:calc(env(safe-area-inset-top,0px) + 14px);--sb:calc(env(safe-area-inset-bottom,0px) + 12px)}
}

/* primitives */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);animation:in .26s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 22px 26px}
.body::-webkit-scrollbar{display:none}
.bar{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 2px) 18px 6px;flex:none}
.bar h2{flex:1;text-align:center;font-family:var(--head);font-weight:600;font-size:19px;margin:0}
.bar .sp{width:48px}
.back{width:48px;height:48px;border-radius:15px;background:#fff;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.back.dark{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;backdrop-filter:blur(8px)}
.head{display:flex;align-items:flex-start;gap:12px;padding:calc(var(--st) + 6px) 22px 10px;flex:none}
.head .grow p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.head h1{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.05;margin:2px 0 0}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:22px;flex:none}
.title{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.08;margin:8px 0 10px}
.lead{color:var(--muted);font-size:16.5px;line-height:1.5;margin:0 0 20px;font-weight:500}
.sec{font-family:var(--head);font-weight:600;font-size:22px;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec a,.sec button{font-family:var(--body);font-size:15px;font-weight:800;color:var(--ink)}
.label{font-weight:800;font-size:15.5px;margin:20px 0 10px}
.small{font-size:14px;color:var(--muted);font-weight:600;line-height:1.35}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.foot{flex:none;padding:12px 22px var(--sb);display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px 18px;border-radius:24px;font-weight:800;font-size:17.5px;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn svg{width:22px;height:22px}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d)}
.btn.pink:active{box-shadow:0 3px 0 var(--pink-d)}
.btn.navy{background:var(--navy);color:#fff}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.out{background:#fff;border:2px solid var(--line2)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.pillb{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;font-weight:800;font-size:16px}
.pillb.navy{background:var(--navy);color:#fff}
.pillb.out{background:#fff;border:2px solid var(--line2)}
.link{display:block;margin:0 auto;padding:8px;font-weight:800;color:var(--muted);font-size:15.5px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:11px 18px;border-radius:999px;background:#fff;border:2px solid var(--line2);font-weight:800;font-size:15px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.input{width:100%;height:60px;border-radius:20px;border:2px solid var(--line2);background:#fff;padding:0 20px;font-size:17px;outline:none;font-weight:600}
.input::placeholder{color:#b1a6c2}
.input:focus{border-color:var(--lav)}
.fl{display:block;margin-bottom:14px}
.fl span{display:block;font-weight:800;font-size:15px;margin-bottom:8px}
.sw{width:54px;height:32px;border-radius:999px;background:#e6dcef;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0002;transition:left .2s}
.sw.on{background:var(--mint-d)}.sw.on::after{left:25px}
.list{background:#fff;border:2px solid var(--line);border-radius:24px;overflow:hidden}
.list>*{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:left;border-bottom:2px solid var(--line);font-weight:700}
.list>*:last-child{border-bottom:0}
.chev{color:var(--faint);display:grid}.chev svg{width:20px;height:20px}
.note{border:2px dashed var(--line2);border-radius:18px;padding:11px 14px;font-size:13px;color:var(--muted);font-weight:600;background:#fff8}
.tag{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.reg{background:var(--lav-l);color:#5b45b8}.tag.one{background:var(--sun-l);color:#8a6a00}
.tag.ok{background:var(--mint-l);color:var(--mint-d)}.tag.no{background:var(--pink-l);color:var(--pink-d)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;font-weight:800;font-size:14.5px;padding:12px 18px;border-radius:999px;white-space:nowrap;animation:toast 2.4s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* icon tiles */
.it{--s:56px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--navy)}
.it svg{width:58%;height:58%}
.it img{width:100%;height:100%;object-fit:cover}
.c-pink{background:var(--pink)}.c-sky{background:var(--sky)}.c-mint{background:var(--mint)}.c-sun{background:var(--sun)}.c-lav{background:var(--lav)}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:2px solid var(--line);padding:8px 6px var(--sb);align-items:end}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--faint);padding:6px 0;border-radius:18px;position:relative}
.tabs button svg{width:25px;height:25px}
.tabs button.on{color:var(--ink)}
.tabs button.on:not(.center) .tb{background:var(--lav-l)}
.tabs .tb{display:grid;place-items:center;width:52px;height:32px;border-radius:14px}
.tabs .cbtn{width:62px;height:62px;margin-top:-32px;border-radius:50%;background:var(--pink);color:var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 var(--pink-d),0 0 0 6px #fff}
.tabs .cbtn svg{width:30px;height:30px}
.tabs .lockdot{position:absolute;top:2px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.tabs .lockdot svg{width:11px;height:11px;color:var(--navy)}

/* mascot / onboarding */
.mascot{display:block}
.splash{background:var(--navy);color:#fff}
.splash .brand{color:#fff}
.splash .tagline{color:var(--lav);font-weight:800;font-size:17.5px;margin:0}
.crownb{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--navy);font-weight:800;font-size:13.5px;padding:6px 12px;border-radius:999px}
.crownb svg{width:16px;height:16px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.brand{font-family:var(--head);font-weight:700;font-size:52px;margin:18px 0 4px;letter-spacing:-.01em}
.blob{width:210px;height:210px;margin:0 auto 30px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;display:grid;place-items:center;animation:morph 8s ease-in-out infinite}
.blob svg{width:46%;height:46%;color:var(--navy)}
@keyframes morph{50%{border-radius:56% 44% 46% 54%/44% 56% 44% 56%}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.dots i{width:9px;height:9px;border-radius:5px;background:var(--line2);transition:width .2s}
.dots i.on{width:26px;background:var(--navy)}
.social{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 20px;border-radius:22px;background:#fff;border:2px solid var(--line2);font-weight:800;font-size:16.5px;margin-bottom:10px}
.social .g{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:17px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-weight:800;font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.perm{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.perm:last-child{border:0}
.privacy{display:flex;gap:12px;background:var(--mint-l);border-radius:22px;padding:16px;margin-top:16px;font-size:14.5px;line-height:1.45;font-weight:600;color:#1f5e47}
.privacy svg{flex:none;width:24px;height:24px}

/* registration */
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:200px;border-radius:30px;background:var(--lav);cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:20px}
.photo svg{width:56px;height:56px;color:var(--navy)}
.photo b{font-family:var(--head);font-weight:600;font-size:21px}
.photo input{display:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.voice{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--mint);border-radius:28px;padding:16px 18px}
.voice .mic{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.voice .mic svg{width:26px;height:26px}
.voice b{display:block;font-family:var(--head);font-weight:600;font-size:19px}
.voice span{font-size:14.5px;font-weight:600;line-height:1.4;display:block}
.voice.rec .mic{background:var(--pink-d);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.1)}}

/* find home */
.findwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 22px}
.findbtn{position:relative;width:230px;height:230px;border-radius:50%;display:grid;place-items:center}
.findbtn .core{position:relative;z-index:2;width:184px;height:184px;border-radius:50%;background:var(--pink);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 9px 0 var(--pink-d);transition:transform .12s,box-shadow .12s}
.findbtn:active .core{transform:translateY(5px);box-shadow:0 4px 0 var(--pink-d)}
.findbtn .core svg{width:64px;height:64px}
.findbtn .core b{font-family:var(--head);font-weight:700;font-size:26px}
.findbtn .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--pink);opacity:0;animation:ripple 2.6s ease-out infinite}
.findbtn .r2{animation-delay:1.3s}
@keyframes ripple{0%{transform:scale(.78);opacity:.7}100%{transform:scale(1.22);opacity:0}}
.hint{margin:0;color:var(--muted);font-weight:800}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -22px;padding:2px 22px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.thingc{min-width:0;flex:none;width:166px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px}
.thingc b{font-family:var(--head);font-weight:600;font-size:19px;display:block}
.thingc .small,.thingc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:none;width:176px;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px;text-align:left}
.mini>div{min-width:0}
.mini b{display:block;font-family:var(--head);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.found-t{color:var(--mint-d);font-weight:800;font-size:13.5px}

/* search */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:22px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:800}
.pick .it{--s:46px}
.pick.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.alt{display:grid;grid-template-columns:100px 1fr;gap:10px}
.upload{border-radius:22px;border:2px dashed var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;min-height:100px;overflow:hidden;position:relative;text-align:center}
.upload svg{width:26px;height:26px}
.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upload input{display:none}
.say{min-width:0;border-radius:22px;background:#fff;border:2px solid var(--line2);display:flex;align-items:center;padding:0 8px 0 16px;gap:8px}
.say input{flex:1;width:100%;border:0;outline:none;height:56px;font-size:15.5px;font-weight:600;background:none;min-width:0}
.micb{width:44px;height:44px;border-radius:50%;background:var(--mint);display:grid;place-items:center;flex:none}
.micb svg{width:21px;height:21px}
.micb.rec{background:var(--pink);animation:beat 1s infinite}
.orb{position:relative;width:190px;height:190px;display:grid;place-items:center;margin-bottom:26px}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:6px solid transparent;border-top-color:var(--pink);border-right-color:var(--lav);animation:spin 1.3s linear infinite}
.orb::after{inset:20px;border-top-color:var(--mint);border-right-color:transparent;animation-duration:2s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .it{--s:96px}
.steps{list-style:none;padding:0;margin:0;text-align:left;display:grid;gap:12px;width:100%}
.steps li{display:flex;gap:12px;align-items:center;font-weight:800;color:#c2b7d2;transition:color .3s}
.steps li i{width:28px;height:28px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;flex:none;font-style:normal}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--mint);border-color:var(--mint)}
.steps li.done i::after{content:"✓";font-size:14px;font-weight:900}
.prob{height:12px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}
.prob i{display:block;height:100%;border-radius:6px;background:var(--pink)}
.calm{background:linear-gradient(180deg,#dcf9ec 0%,#efe9ff 100%)}
.calm .scr,.calm{}
.bcircle{width:240px;height:240px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:30px}
.bcircle::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--mint);animation:breathe 8s ease-in-out infinite;box-shadow:0 0 0 18px #55e2a933}
.bcircle span{position:relative;font-family:var(--head);font-weight:600;font-size:26px}
@keyframes breathe{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
.plan{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.plan li{counter-increment:p;display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:13px 14px;font-weight:800}
.plan li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}

/* camera */
.cam{background:#120e19;color:#fff}
.cam .room{position:absolute;inset:0;width:100%;height:100%}
.camtop{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 2px) 16px 0}
.cpill{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:8px;background:rgba(20,14,34,.62);backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px 7px 7px;font-weight:800;font-size:14px}
.cpill .it{--s:30px;border-radius:50%}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;background:rgba(20,14,34,.62);padding:9px 13px;border-radius:999px}
.bubble{position:relative;z-index:5;margin:12px 16px 0;align-self:flex-start;background:#fff;color:var(--ink);border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:15px;font-weight:800;max-width:290px;box-shadow:0 10px 30px -10px #000a;animation:in .4s .2s both}
.bubble small{display:block;color:var(--muted);font-weight:600;margin-top:2px;font-size:13px}
.scanline{position:absolute;left:0;right:0;height:120px;top:-120px;z-index:3;background:linear-gradient(180deg,transparent,#55e2a933 70%,#55e2a9aa);border-bottom:3px solid var(--mint);animation:sweep 2.4s linear infinite;pointer-events:none}
@keyframes sweep{to{top:100%}}
.sheet{position:relative;z-index:6;margin-top:auto;background:var(--bg);color:var(--ink);border-radius:32px 32px 0 0;padding:10px 22px var(--sb);box-shadow:0 -10px 40px #0006;animation:up .35s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-family:var(--head);font-weight:600;font-size:24px;margin:2px 0 6px}
.sheet p{margin:0 0 14px;color:var(--muted);line-height:1.45;font-weight:600}
.acts{display:grid;gap:10px}.acts.two{grid-template-columns:1fr 1fr}
.prog{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog b{font-size:16.5px;font-weight:800}

.wide{grid-column:1/-1}

.checkitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:2px solid var(--line);text-align:left;font-weight:800}

.checkitem.on .box{background:var(--mint);border-color:var(--mint)}

</head>

const tile=(x,s=56)=>`<span class="it c-${x.c||'lav'}" style="--s:${s}px">${x.img?`<img src="${x.img}" alt="">`:(TI[x.k]||TI.other)}</span>`;
const bar=(t,o={})=>`<header class="bar">${o.back===false?'<span class="sp"></span>':`<button class="back" data-back aria-label="Back">${I.back}</button>`}<h2>${t||''}</h2>${o.right||'<span class="sp"></span>'}</header>`;
const head=(eyebrow,title,right='')=>`<header class="head"><div class="grow">${eyebrow?`<p>${eyebrow}</p>`:''}<h1>${title}</h1></div>${right}</header>`;
const tabs=a=>{
  const t=(id,ic,l)=>`<button data-go="${id}" class="${a===id?'on':''}"><span class="tb">${ic}</span><span>${l}</span>${id==='family'&&!S.sub?`<span class="lockdot">${I.crown}</span>`:''}</button>`;
  return `<nav class="tabs">${t('history',I.clock,'History')}${t('things',I.grid,'Things')}<button data-go="find" class="center ${a==='find'?'on':''}"><span class="cbtn">${I.search}</span><span>Find</span></button>${t('family',I.family,'Family')}${t('settings',I.sliders,'Settings')}</nav>`;
};
const elapsed=()=>{const s=S.startTime?Math.max(1,Math.round((Date.now()-S.startTime)/1000)):0;return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

/* ---------- illustrated camera room ---------- */
function marker(id,state){
  const m=SPOTS[id];const st=S.checked.has(id)?'done':(state||'todo');
  const c=st==='done'?'#55e2a9':st==='warn'?'#ffe26a':'#ffffff';
  const w=m.label.length*6.9+20,flip=m.x>250,top=m.pos==='t';
  return `<g class="mk" data-act="spot" data-id="${id}" transform="translate(${m.x} ${m.y})" style="cursor:pointer">
   <circle r="21" fill="${c}" class="pulse"/><circle r="12" fill="${c}" stroke="#33265a" stroke-opacity=".35" stroke-width="2"/>
   ${st==='done'?'<path d="M-5.5 0l4 4 6.5-7.5" stroke="#33265a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}
   ${st==='warn'?'<text y="5" text-anchor="middle" font-size="14" font-weight="900" fill="#33265a">!</text>':''}
   <g transform="translate(${top?-w/2:flip?-(w+18):18} ${top?-48:-12})"><rect width="${w}" height="24" rx="12" fill="rgba(51,38,90,.85)"/><text x="10" y="16.5" fill="#fff" font-size="12" font-family="Nunito,sans-serif" font-weight="800">${m.label}</text></g></g>`;
}
function room(o={}){

  return `<svg class="room" viewBox="0 60 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b3c6e"/><stop offset="1" stop-color="#2e2448"/></linearGradient>
  <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2240"/><stop offset="1" stop-color="#171126"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#ffe26a" stop-opacity=".45"/><stop offset="1" stop-color="#ffe26a" stop-opacity="0"/></radialGradient>
  <pattern id="gd" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#55e2a9" stroke-width=".9"/></pattern></defs>
  <rect width="390" height="530" fill="url(#wl)"/><rect y="530" width="390" height="380" fill="url(#fl)"/><rect y="524" width="390" height="8" fill="#211935"/>
  <rect x="34" y="96" width="132" height="170" rx="10" fill="#74c6fb" opacity=".55"/><circle cx="72" cy="134" r="11" fill="#fff" opacity=".7"/>
  <rect x="34" y="96" width="132" height="170" rx="10" fill="none" stroke="#2e2448" stroke-width="8"/><path d="M100 96v170M34 181h132" stroke="#2e2448" stroke-width="6"/>
  <rect x="200" y="118" width="56" height="8" rx="4" fill="#a98a6a"/><path d="M214 126q-16 44-6 124h44q8-80-8-124z" fill="#ff86bd" opacity=".75"/>
  <rect x="266" y="176" width="104" height="8" rx="4" fill="#a98a6a"/><rect x="276" y="132" width="13" height="44" rx="3" fill="#ffe26a"/><rect x="291" y="140" width="11" height="36" rx="3" fill="#74c6fb"/><rect x="304" y="128" width="14" height="48" rx="3" fill="#c7b6ff"/><rect x="338" y="160" width="20" height="16" rx="4" fill="#ff86bd"/><circle cx="348" cy="150" r="13" fill="#55e2a9"/>
  <circle cx="336" cy="390" r="110" fill="url(#gl)"/>
  <rect x="331" y="400" width="6" height="52" fill="#d9c3a3"/><path d="M313 402l11-38h20l11 38z" fill="#ffe26a"/>
  <rect x="300" y="452" width="74" height="10" rx="4" fill="#a98a6a"/><rect x="306" y="462" width="62" height="96" rx="6" fill="#6b5778"/>
  <rect x="22" y="360" width="268" height="96" rx="28" fill="#7a63b8"/><rect x="22" y="440" width="268" height="88" rx="22" fill="#6a54a6"/>
  <rect x="52" y="420" width="102" height="42" rx="16" fill="#8d77cc"/><rect x="160" y="420" width="102" height="42" rx="16" fill="#8d77cc"/>
  <rect x="8" y="410" width="44" height="122" rx="20" fill="#7a63b8"/><rect x="262" y="410" width="44" height="122" rx="20" fill="#7a63b8"/>
  <ellipse cx="195" cy="700" rx="186" ry="72" fill="#3d2f5c"/><ellipse cx="195" cy="700" rx="160" ry="56" fill="none" stroke="#55e2a9" stroke-opacity=".35" stroke-width="3" stroke-dasharray="6 8"/>
  <rect x="96" y="612" width="200" height="22" rx="11" fill="#a98a6a"/><rect x="110" y="634" width="10" height="58" rx="4" fill="#86694d"/><rect x="272" y="634" width="10" height="58" rx="4" fill="#86694d"/>
  <rect x="140" y="592" width="20" height="20" rx="5" fill="#fff"/>
  ${o.keys?`<g transform="translate(326 578) rotate(-18)"><circle r="7" fill="none" stroke="#ffe26a" stroke-width="3.6"/><rect x="6" y="-2" width="20" height="4" rx="2" fill="#ffe26a"/></g>`:''}
  ${o.dim?'<rect y="60" width="390" height="844" fill="#120e19" opacity=".35"/>':''}
  ${o.mesh?'<rect class="mesh" y="60" width="390" height="844" fill="url(#gd)" opacity=".45"/>':''}
  ${o.match?'<g class="matchbox"><rect x="296" y="546" width="80" height="58" rx="14" fill="rgba(255,134,189,.18)" stroke="#ff86bd" stroke-width="3.5" stroke-dasharray="10 6"/></g>':''}
  ${mk}</svg>`;
}
const camShell=(sheet,o={})=>`<div class="scr cam" data-light>${room(o)}
  <div class="camtop"><button class="back dark" data-go="notfound" aria-label="Exit">${I.x}</button><span class="cpill">${tile(it(),30)}${S.mode==='calm'?'Calm search':'Quick search'}: ${lc(it().name)}</span><span class="timer" id="tmr">${elapsed()}</span></div>
  ${o.bubble||''}${sheet}</div>`;
const doneCount=()=>S.spots.filter(id=>S.checked.has(id)).length;

/* ---------- screens ---------- */
const SC={
/* Onboarding */
splash:{g:'Onboarding',l:'Splash',html:()=>`<div class="scr splash" data-light><div class="mid">${mascot(150)}<div class="brand" style="margin-top:22px">FIND ME!</div><p class="tagline">Lost it? Let's look together.</p></div>
  <div class="foot"><button class="btn pink" data-go="welcome">Get started</button></div></div>`},
welcome:{g:'Onboarding',l:'Welcome',html:()=>{const s=[
  ['var(--pink)',I.camera,'Point. Scan. Found.','Your camera remembers every spot you already checked, so you never search the same place twice.'],
  ['var(--mint)',I.sun,'Stressed? We slow down with you.','If a quick search doesn\'t work, FIND ME switches to a calm mode to help you breathe and retrace your steps.'],

  <div class="foot"><button class="btn pink" data-go="profile">Create account</button><button class="link" data-go="login">I already have an account</button></div></div>`},
login:{g:'Onboarding',l:'Log in',html:()=>`<div class="scr">${bar('')}<div class="body"><div style="margin:4px 0 6px">${mascot(70)}</div><h1 class="title">Welcome back</h1><p class="lead">Log in to pick up where you left off.</p>
  <button class="social" data-act="afterLogin"><span class="g" style="background:#fff;border:2px solid var(--line2);color:#4285f4">G</span>Continue with Google</button>

  <div class="or">or with email</div>

  <label class="fl"><span>Password</span><input class="input" type="password" placeholder="Password"></label></div>
  <div class="foot"><button class="btn navy" data-act="afterLogin">Log in</button></div></div>`},
profile:{g:'Onboarding',l:'Profile setup',html:()=>`<div class="scr">${bar('')}<div class="body"><h1 class="title">A little about you</h1><p class="lead">This helps FIND ME suggest the right spots first.</p>
  <label class="fl"><span>What should we call you?</span><input class="input" value="Jisoo"></label>

  <div class="foot"><button class="btn navy" data-go="perms">Continue</button></div></div>`},
perms:{g:'Onboarding',l:'Permissions + privacy',html:()=>`<div class="scr">${bar('')}<div class="body"><h1 class="title">Before we start</h1><p class="lead">FIND ME only asks for what it needs.</p>
  <div class="card" style="padding:4px 18px">
   <div class="perm"><span class="it c-pink" style="--s:46px">${I.camera}</span><div class="grow"><b>Camera</b><div class="small">To scan rooms and spot your things</div></div><button class="sw on" id="camsw" data-act="tg"></button></div>
   <div class="perm"><span class="it c-sun" style="--s:46px">${I.bell}</span><div class="grow"><b>Notifications</b><div class="small">Evening check reminders</div></div><button class="sw on" data-act="tg"></button></div>
   <div class="perm"><span class="it c-sky" style="--s:46px">${I.compass}</span><div class="grow"><b>Location</b><div class="small">Optional · remembers where you last had things</div></div><button class="sw" data-act="tg"></button></div></div>

  <div class="foot"><button class="btn pink" data-act="letsGo">Let's go</button></div></div>`},
camoff:{g:'Onboarding',l:'Camera off notice',html:()=>`<div class="scr">${bar('')}<div class="mid">${mascot(110,'sad')}<h1 class="title" style="margin-top:18px">Scanning needs your camera</h1>

  <div class="foot"><button class="btn navy" data-go="askreg">Continue</button></div></div>`},
askreg:{g:'Onboarding',l:'Register things now?',html:()=>`<div class="scr"><div class="mid"><div class="bob">${mascot(110)}</div><h1 class="title" style="margin-top:18px">Want to add your things now?</h1>

  <div class="chips">${[['keys','Keys'],['glasses','Glasses'],['wallet','Wallet'],['phone','Phone'],['pill','Medicine'],['other','Other']].map(([k,l])=>`<button class="chip ${x.k===k?'on':''}" data-act="editType" data-k="${k}">${l}</button>`).join('')}</div>
  <label class="fl" style="margin-top:18px"><span>Where it usually lives</span><input class="input" id="espot" value="${x.spot}"></label>
  <button class="voice" data-act="voice"><span class="mic">${I.mic}</span><span class="grow"><b>${x.voice?'Re-record voice note':'Record a voice note'}</b><span>${x.voice||'Say why it lives there.'}</span></span></button>
  <button class="link" style="color:var(--pink-d);margin-top:16px" data-go="delThing">Delete this thing</button></div>
  <div class="foot"><button class="btn navy" data-act="saveEdit">Save</button></div></div>`;},
  mount(){S.editK=null;S.editVoice=null;S.editPhoto=null}},
delThing:{g:'Tabs',l:'Delete thing?',html:()=>{const x=it();return `<div class="scr"><div class="mid">${tile(x,88)}<h1 class="title" style="margin-top:20px">Delete ${x.name}?</h1><p class="lead">It will be removed from Your things. Its search history stays in History.</p></div>
  <div class="foot"><button class="btn danger" data-act="deleteThing">Delete</button><button class="link" data-back>Cancel</button></div></div>`;}},

/* Starting a search */
what:{g:'Starting a search',l:'What are you looking for?',html:()=>`<div class="scr">${bar('New search')}<div class="body">
  <h1 class="title" style="margin-top:0">What are you looking for?</h1>
  <div class="label" style="margin-top:6px">Your things</div>
  <div class="grid4">${S.mine.map(x=>`<button class="pick ${S.item&&S.item.id===x.id?'on':''}" data-act="pickMine" data-id="${x.id}">${tile(x,46)}${x.name}</button>`).join('')}</div>
  <div class="label">Something else <span class="tag one" style="margin-left:4px">One-time</span></div>
  <div class="chips" style="margin-bottom:10px">${ONETIME.map((x,n)=>`<button class="chip" data-act="pickOne" data-n="${n}">${x.name}</button>`).join('')}</div>
  <div class="alt"><label class="upload" id="up">${I.camera}Photo<input type="file" accept="image/*" id="file"></label>
  <div class="say"><input id="custom" placeholder="Type or say it"><button class="micb" data-act="mic" aria-label="Speak">${I.mic}</button></div></div></div>
  <div class="foot"><button class="btn navy" id="cont" data-go="analyzing" ${S.item?'':'disabled'}>Continue</button></div></div>`},
analyzing:{g:'Starting a search',l:'AI analyzing',html:()=>`<div class="scr"><div class="mid"><div class="orb">${tile(it(),96)}</div>
  <h1 class="title">Looking into it…</h1><p class="lead">Matching your ${lc(it().name)} with your habits.</p>
  <ul class="steps" id="steps"><li><i></i>Recognizing the item</li><li><i></i>Checking where you last had it</li><li><i></i>Ranking the most likely spots</li></ul>
  <button class="simlink" data-act="recogFail">Prototype: simulate "couldn't recognize it"</button></div>
  <div class="foot"><button class="btn navy" id="see" data-act="startQuick" data-go="mapping" style="visibility:hidden">Scan the room</button></div></div>`,
  mount(){const li=[...document.querySelectorAll('#steps li')];li.forEach((l,n)=>later(()=>l.classList.add('done'),600+n*650));later(()=>{const b=document.getElementById('see');if(b)b.style.visibility='visible'},2600)}},
autocalm:{g:'Starting a search',l:'Auto switch to Calm',html:()=>`<div class="scr calm"><div class="mid">${mascot(110)}<h1 class="title" style="margin-top:18px">Not there yet. Let's slow down.</h1>
  <p class="lead">You checked all ${doneCount()} likely spots. Calm mode will help you breathe and remember where you've been, then we'll look in new places.</p></div>
  <div class="foot"><button class="btn mint" data-go="breathe">Okay, let's breathe</button></div></div>`},
breathe:{g:'Starting a search',l:'Calm: breathing',html:()=>`<div class="scr calm">${bar('Calm mode')}<div class="mid"><div class="bcircle"><span id="bt">Breathe in</span></div>
  <h1 class="title" style="font-size:27px">It's somewhere close.</h1><p class="lead">Most things turn up a few steps from where they were last used. Take three slow breaths.</p></div>
  <div class="foot"><button class="btn mint" data-go="retrace">I'm ready</button><button class="link" data-go="retrace">Skip</button></div></div>`,
  mount(){let o=true;timers.push(setInterval(()=>{const e=document.getElementById('bt');if(e){o=!o;e.textContent=o?'Breathe in':'Breathe out'}},4000))}},
retrace:{g:'Starting a search',l:'Calm: retrace + plan',html:()=>`<div class="scr calm">${bar('Retrace')}<div class="body">
  <h1 class="title" style="margin-top:0">Let's retrace your steps</h1>
  <div class="label">When did you last have it?</div>
  <div class="chips"><button class="chip on" data-act="pick">This morning</button><button class="chip" data-act="pick">Last night</button><button class="chip" data-act="pick">Not sure</button></div>
  <div class="label">Where have you been since?</div>
  <div class="chips">${['Entryway','Living room','Kitchen','Bedroom','Car'].map((r,n)=>`<button class="chip ${n<2?'on':''}" data-act="chip">${r}</button>`).join('')}</div>
  <div class="label">New places to try</div>
  <ol class="plan">${EXTRA.map(id=>`<li>${SPOTS[id].label}</li>`).join('')}<li>Bag or jacket you wore</li></ol></div>
  <div class="foot">${S.inScan?`<button class="btn navy" data-act="resume" data-go="scan">Resume scan (keeps checked spots)</button><button class="link" data-act="calmNew" data-go="mapping">Start a new search instead</button>`:`<button class="btn navy" data-act="calmNew" data-go="mapping">Start searching</button>`}</div></div>`},

/* Scanning */
mapping:{g:'Scanning',l:'Mapping the room',html:()=>`<div class="scr cam" data-light>${room({mesh:true,markers:''})}<div class="scanline"></div>
  <div class="camtop"><button class="back dark" data-go="notfound" aria-label="Exit">${I.x}</button><span class="cpill" style="padding:9px 14px;margin-left:auto">Mapping the room</span></div>
  <div class="sheet"><h3>Slowly move your phone around</h3><p>We're building a map so we can remember every spot you check.</p>
  <div class="prog"><b id="pct">0%</b><span class="small" id="pl">Finding surfaces…</span></div><div class="prob"><i id="pb" style="width:0%;background:var(--mint);transition:width .2s"></i></div>
  <div class="acts" style="margin-top:16px"><button class="btn pink" id="go" data-go="scan" disabled>Start scanning</button></div>
  <div class="sim"><p>Prototype</p><div class="chips"><button class="chip" data-go="maptips">Too dark / mapping failed</button></div></div></div></div>`,
  mount(){let p=0;const t=setInterval(()=>{p=Math.min(100,p+4);const a=document.getElementById('pct');if(!a)return;a.textContent=p+'%';document.getElementById('pb').style.width=p+'%';
   document.getElementById('pl').textContent=p<40?'Finding surfaces…':p<80?'Marking furniture…':p<100?'Almost there…':'Room mapped';if(p>=100){document.getElementById('go').disabled=false;clearInterval(t)}},90);timers.push(t)}},
maptips:{g:'Scanning',l:'Mapping tips',html:()=>`<div class="scr cam" data-light>${room({dim:true,markers:''})}<div class="camtop"><button class="back dark" data-go="notfound" aria-label="Exit">${I.x}</button></div>
  <div class="sheet"><div class="badge" style="background:var(--sun)">${I.sun}</div><h3>It's a little dark in here</h3><p>We couldn't map the room. Turn on a light and move your phone a bit slower.</p>
  <div class="acts"><button class="btn navy" data-go="mapping">Try again</button></div></div></div>`},
scan:{g:'Scanning',l:'Scanning + suggestions',html:()=>{const next=S.spots.find(id=>!S.checked.has(id));const n=doneCount(),t=S.spots.length;
  return camShell(`<div class="sheet"><div class="row" style="margin-bottom:12px"><span class="it c-sun" style="--s:46px">${I.compass}</span><div class="grow"><div class="small">${next?'Next spot · tap the marker after you look':'All marked spots checked'}</div><b style="font-size:18px">${next?'Check the '+lc(SPOTS[next].label):'Try under furniture'}</b></div></div>
   <div class="prog"><b>${n} of ${t} spots checked</b><span class="small">Living room</span></div><div class="prob" style="margin-bottom:14px"><i style="width:${n/t*100}%;background:var(--mint)"></i></div>
   <button class="btn mint" data-act="foundSelf" data-go="foundWhere">Found</button></div>`,
   {});},
  mount(){S.inScan=true}},
foundWhere:{g:'Scanning',l:'Where was it?',html:()=>{const sp=[...S.spots].sort((a,b)=>S.checked.has(b)-S.checked.has(a));return `<div class="scr">${bar('')}<div class="body">
  <div class="row" style="margin-bottom:6px">${tile(it(),56)}<span class="tag ok">Found</span></div>
  <h1 class="title">Where did you find your ${lc(it().name)}?</h1><p class="lead">We'll save it as the last-seen place.</p>
  <div class="chips" id="wh">${sp.map(id=>`<button class="chip" data-act="pickWhere" data-v="${SPOTS[id].label}">${SPOTS[id].label}</button>`).join('')}</div>
  <label class="fl" style="margin-top:18px"><span>Somewhere else</span><input class="input" id="whereText" placeholder="e.g. In my jacket pocket"></label></div>
  <div class="foot"><button class="btn pink" id="whereOk" data-go="found" disabled>Save</button></div></div>`;}},
found:{g:'Scanning',l:'Found it!',html:()=>`<div class="scr" style="background:radial-gradient(100% 60% at 50% 35%,#dcf9ec,#fff4fb 70%)"><div class="mid"><div class="burst">${Array.from({length:14},(_,n)=>{const a=n/14*Math.PI*2,d=95+Math.random()*30;return `<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*360}deg;background:var(--${COLORS[n%5]})"></i>`}).join('')}<div class="ok">${I.check}</div></div>
  <h1 class="title" style="font-size:46px">Found it!</h1><p class="lead">${it().name}: ${lc(S.foundAt||'under the side table')}.<br>Searched for ${elapsed()}.</p></div>
  <div class="foot"><button class="btn navy" data-go="summary">Nice, done</button></div></div>`},
summary:{g:'Scanning',l:'Search summary',html:()=>{const x=it();return `<div class="scr">${bar('Search summary',{back:false})}<div class="body">
  <div class="row" style="margin-bottom:16px">${tile(x,60)}<div><b style="font-family:var(--head);font-weight:600;font-size:24px">${x.name}</b><div class="row" style="gap:6px"><span class="tag ok">Found</span><span class="tag ${x.one?'one':'reg'}">${x.one?'One-time':'Registered'}</span></div></div></div>
  <div class="stats"><div class="stat" style="background:var(--mint)"><b>${elapsed()}</b><span>Time</span></div><div class="stat" style="background:var(--sky)"><b>${doneCount()}</b><span>Spots</span></div><div class="stat" style="background:var(--sun)"><b>${S.mode==='calm'?'Calm':'Quick'}</b><span>Mode</span></div>
  <div class="stat wide card" style="border-radius:22px"><span class="small">Found at</span><b style="font-size:22px;margin-top:4px">${S.foundAt||'Under the side table'}</b></div></div>
  ${x.one?`<div class="pattern"><h4>Save ${lc(x.name)} to Your things?</h4><p>Next time FIND ME will remember where it usually lives and where you last had it.</p><div class="row" style="gap:10px"><button class="pillb navy" data-act="saveOne" data-go="reg1">Save to Things</button><button class="pillb out" data-go="find">No thanks</button></div></div>`
  :`<div class="pattern"><h4>📍 Noted</h4><p>We updated its last-seen place. It's ended up in the living room 3 times this month.</p></div>`}</div>
  <div class="foot"><button class="btn navy" data-go="find">Back home</button></div></div>`;},
  mount(){if(!S.logged&&S.item){const x=S.item;S.hist.unshift({name:x.name,k:x.k,c:x.c,img:x.img,one:!!x.one,when:'Just now',res:'Found · '+(S.foundAt||'Side table'),ok:true});S.logged=true;if(!x.one){x.last=S.foundAt||'Under the side table';x.lastT='Just now'}}}},

/* Not found */
notfound:{g:"Not found",l:'Not found yet',html:()=>{const left=S.spots.filter(id=>!S.checked.has(id));return `<div class="scr">${bar('',{back:false,right:`<button class="back" data-go="find" aria-label="Close">${I.x}</button>`})}<div class="body" style="text-align:center">
  <div style="margin:0 auto 6px;width:fit-content">${mascot(100,'sad')}</div><h1 class="title">Not found yet</h1><p class="lead">That's okay. You checked ${doneCount()} of ${S.spots.length} spots in the living room.</p>
  ${left.length?`<div class="list" style="text-align:left">${left.map(id=>`<div><span class="it c-lav" style="--s:36px">${I.compass}</span><span class="grow">${SPOTS[id].label}</span></div>`).join('')}</div>`:''}</div>
  <div class="foot"><button class="btn navy" data-act="newRoom" data-go="mapping">Search another room</button><button class="btn out" data-go="lost">I think it's truly lost</button><button class="link" data-go="find">Back home</button></div></div>`;}},
lost:{g:"Not found",l:'Truly lost + shop',html:()=>`<div class="scr">${bar("Let's handle it")}<div class="body">
  <h1 class="title" style="margin-top:0">Losing things happens to everyone.</h1><p class="lead">We saved it in History. If it turns up, mark it found in one tap.</p>
  <button class="talk" data-go="shop"><span class="it c-sun" style="--s:52px">${I.bag}</span><div class="grow"><b>Replace your ${lc(it().name)}</b><span class="small">Key copies, wallets and more</span></div><span class="chev">${I.chev}</span></button>
  <button class="talk" data-go="dots1" style="background:var(--navy);color:#fff;border-color:var(--navy)"><span class="it c-pink" style="--s:52px">${I.sticker}</span><div class="grow"><b>Never lose it again</b><span style="color:#d6ccef;font-weight:600;font-size:13.5px">FIND ME Dots stickers show up while you scan</span></div><span class="chev">${I.chev}</span></button>
  <div class="label">Also worth doing</div>
  <div class="list"><div><span class="it c-sky" style="--s:38px">${I.bell}</span><span class="grow">Call the last places you visited</span></div><div><span class="it c-mint" style="--s:38px">${I.shield}</span><span class="grow">Block cards or change locks if needed</span></div></div></div>
  <div class="foot"><button class="btn navy" data-act="markLost" data-go="find">Back home</button></div></div>`},
shop:{g:"Not found",l:'Replacement shop',html:()=>`<div class="scr">${bar('Replace it')}<div class="body">
  <h1 class="title" style="margin-top:0">Get back on track</h1><p class="lead">Picked for a lost ${lc(it().name)}.</p>
  ${[['Key copy service','Bring a spare to a locksmith near you','keys','pink'],['Key ring with tag','Easier to spot in a scan','keys','sun'],['Slim wallet','For cards and ID','wallet','sky']].map(([t,d,k,c])=>`<div class="talk">${tile({k,c},52)}<div class="grow"><b>${t}</b><span class="small" style="display:block">${d}</span><span class="small" style="display:block;font-weight:800;color:var(--ink)">Price TBD</span></div><button class="pillb navy" style="padding:9px 14px;font-size:14px" data-act="toast" data-m="Opens the store (prototype)">View</button></div>`).join('')}</div>
  <div class="foot"><button class="btn out" data-go="find">Done</button></div></div>`},
dots1:{g:"Not found",l:'Dots: get stickers',html:()=>`<div class="scr">${bar('FIND ME Dots')}<div class="body">
  <div class="blob" style="background:var(--pink);width:180px;height:180px;margin-bottom:22px">${I.sticker}</div>
  <h1 class="title" style="text-align:center">Tiny stickers, big help</h1><p class="lead" style="text-align:center">Stick a Dot on your keys, glasses or pill box. Your camera spots it from across the room.</p>
  <div class="feat"><div>Lights up during a scan, even under cushions</div><div>Works with things you've registered</div><div>Pack of 6 · Price TBD</div></div></div>
  <div class="foot"><button class="btn pink" data-go="dots2">Get stickers</button></div></div>`},
dots2:{g:"Not found",l:'Dots: pair a sticker',html:()=>`<div class="scr">${bar('Pair a Dot')}<div class="body">
  <h1 class="title" style="margin-top:0">Which thing gets this Dot?</h1><p class="lead">Hold the sticker near your phone, then pick the thing.</p>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${S.mine.map((x,n)=>`<button class="thingc ${n===0?'':''}" style="width:auto" data-act="pick2">${tile(x,48)}<b>${x.name}</b></button>`).join('')}</div></div>
  <div class="foot"><button class="btn navy" data-act="toast" data-m="Dot paired" data-go="things">Pair</button></div></div>`},

/* Check-ins */
checkin:{g:'Check-ins',l:'Check-in settings',html:()=>`<div class="scr">${bar('Evening check')}<div class="body">
  <h1 class="title" style="margin-top:0">A quick check before bed</h1><p class="lead">We'll remind you to put tomorrow's things in one place.</p>
  <div class="label">Things to check</div>
  <div class="chips">${S.mine.map(x=>`<button class="chip ${S.checkItems.includes(x.id)?'on':''}" data-act="checkItem" data-id="${x.id}">${x.name}</button>`).join('')}</div>
  <div class="label">Time</div><select class="input"><option>20:00</option><option selected>20:30</option><option>21:00</option><option>21:30</option></select>
  <div class="label">Days</div><div class="chips" style="gap:6px">${['M','T','W','T','F','S','S'].map((d,n)=>`<button class="chip ${n<5?'on':''}" style="padding:10px 0;width:42px;text-align:center" data-act="chip">${d}</button>`).join('')}</div>
  <div class="label">Where you'll check</div><input class="input" value="Entryway tray"></div>
  <div class="foot"><button class="btn navy" data-go="reminder">Save</button></div></div>`},
reminder:{g:'Check-ins',l:'Reminder notification',html:()=>`<div class="scr lock"><p class="date">Thursday, October 1</p><p class="time">20:30</p>
  <div class="widgets"><div class="wdg">${tile(S.mine[0],36)}<div><b>Keys</b><br>${S.mine[0].last}</div></div><button class="wdg round" data-go="find">${I.search}Find</button></div>
  <button class="notif" data-go="evecheck">${mascot(40)}<div class="grow"><div class="row" style="justify-content:space-between"><b>Evening check</b><span class="small">now</span></div><p>Are your ${S.checkItems.map(id=>lc((S.mine.find(x=>x.id===id)||{name:id}).name)).join(', ')} ready for tomorrow?</p></div></button>
  <p class="lockhint">Prototype · tap the notification, or the Find widget</p></div>`},
evecheck:{g:'Check-ins',l:'Evening check scan',html:()=>`<div class="scr cam" data-light>${room({dim:true,markers:''})}<div class="scanline"></div>
  <div class="camtop"><button class="back dark" data-back aria-label="Back">${I.back}</button><span class="cpill" style="padding:9px 14px;margin-left:auto">Evening check</span></div>
  <div class="sheet"><h3>Point at your entryway tray</h3><p>Tap each thing as you see it.</p>
  ${S.checkItems.map(id=>{const x=S.mine.find(m=>m.id===id);return x?`<button class="checkitem ${S.evening.has(id)?'on':''}" data-act="evItem" data-id="${id}"><span class="box"></span>${tile(x,40)}<span class="grow">${x.name}</span></button>`:''}).join('')}
  <div class="acts" style="margin-top:14px"><button class="btn navy" data-go="checkdone">Got them</button><button class="link" data-act="clearMissing" data-go="missing">Something's missing</button></div></div></div>`},
missing:{g:'Check-ins',l:'Missing thing',html:()=>`<div class="scr">${bar('Evening check')}<div class="body"><h1 class="title" style="margin-top:0">Which one isn't here?</h1><p class="lead">Pick the thing you couldn't see on the tray.</p>
  <div class="grid4" style="grid-template-columns:repeat(3,1fr)">${S.checkItems.map(id=>S.mine.find(m=>m.id===id)).filter(Boolean).map(x=>`<button class="pick" data-act="pickMissing" data-id="${x.id}">${tile(x,46)}${x.name}</button>`).join('')}</div></div>
  <div class="foot"><button class="btn pink" id="findnow" data-act="startQuick" data-go="mapping" disabled>Find it now</button><button class="link" data-go="checkdone">Find it tomorrow</button></div></div>`},
checkdone:{g:'Check-ins',l:'Check complete',html:()=>`<div class="scr" style="background:radial-gradient(100% 60% at 50% 35%,#dcf9ec,#fff4fb 70%)"><div class="mid"><div class="burst"><div class="ok">${I.check}</div></div>
  <h1 class="title">All set for tomorrow</h1><p class="lead">Everything's by the door. Sleep well.</p></div>
  <div class="foot"><button class="btn navy" data-go="find">Back home</button><button class="link" data-go="widgets">Add a lock screen widget</button></div></div>`},
widgets:{g:'Check-ins',l:'Lock screen widgets',html:()=>`<div class="scr">${bar('Widgets')}<div class="body">
  <h1 class="title" style="margin-top:0">Find from your lock screen</h1><p class="lead">Start a search, or see where your keys are, without opening the app.</p>
  <div class="lock" style="border-radius:30px;padding:26px 16px"><div class="widgets" style="margin:0"><div class="wdg">${tile(S.mine[0],36)}<div><b>Keys</b><br>${S.mine[0].last}</div></div><div class="wdg round">${I.search}Find</div></div></div>
  <ol class="plan" style="margin-top:18px"><li>Open your phone's lock screen editor</li><li>Tap "Add widgets"</li><li>Pick FIND ME</li></ol></div>
  <div class="foot"><button class="btn navy" data-go="find">Done</button></div></div>`},

/* Family */
family:{g:'Family',l:'Family tab',html:()=>S.sub?SC.famHome.html():SC.famLocked.html()},
famLocked:{g:'Family',l:'Family (locked, free plan)',html:()=>`<div class="scr">${head('','Family')}
  <div class="locked"><div><div class="lockbig" style="margin:0 auto 16px">${I.crown}</div><span class="crownb" style="margin-bottom:8px">${I.crown}Care plan</span>
  <h1 class="title" style="font-size:30px">Family is a Care plan feature</h1><p class="lead">With the Care plan, help a parent find things, set them up together, and get a weekly note about how they're doing.</p>
  <button class="btn pink" data-go="paywall">See plans</button><button class="link" style="margin-top:6px" data-go="find">Not now</button></div></div>${tabs('family')}</div>`},
famHome:{g:'Family',l:"Family home (Dad's home)",html:()=>{const m=S.members.find(x=>x.id===S.famSel)||S.members[0];return `<div class="scr">${head('Family',`${m.name}'s home`,`<span class="avatar">J</span>`)}<div class="body">
  <div class="members">${S.members.map(x=>`<button class="chip ${x.id===S.famSel?'on':''}" data-act="famSel" data-id="${x.id}">${x.em} ${x.name}</button>`).join('')}<button class="chip" data-go="famAdd">+ Add</button></div>
  <button class="role" data-go="famRole">You: ${S.myRole} <span class="chev">${I.chev}</span></button>

/* ---------- engine ---------- */
const ROOTS=['find','history','things','family','settings','splash'];
let cur=null,timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('wrap').appendChild(t);setTimeout(()=>t.remove(),2500)}
function render(id){
  timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];cur=id;
  const app=document.getElementById('app');app.innerHTML=SC[id].html();
  document.getElementById('sbar').classList.toggle('light',!!app.querySelector('[data-light]'));
  SC[id].mount&&SC[id].mount();
  if(id==='scan')timers.push(setInterval(()=>{const e=document.getElementById('tmr');if(e)e.textContent=elapsed()},1000));
  document.querySelectorAll('#navlist button').forEach(b=>b.classList.toggle('on',b.dataset.jump===id));
}
function go(id){if(!SC[id])return;if(ROOTS.includes(id))S.stack=[];else if(cur&&cur!==id)S.stack.push(cur);render(id)}
function back(){render(S.stack.pop()||'find')}
const resetScan=mode=>{S.mode=mode;S.spots=mode==='calm'?[...QUICK,...EXTRA]:[...QUICK];S.checked=new Set();S.startTime=Date.now();S.inScan=false;S.logged=false;S.foundAt=''};
const ACT={
  nextSlide(){if(S.slide<2){S.slide++;render('welcome')}else{S.slide=0;go('signup')}},
  chip(el){el.classList.toggle('on')},
  pick(el){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')},
  pick2(el){el.parentElement.querySelectorAll('.thingc').forEach(c=>c.style.borderColor='');el.style.borderColor='var(--navy)'},
  tg(el){el.classList.toggle('on')},
  toast(el){toast(el.dataset.m)},
  planPick(el){el.parentElement.querySelectorAll('.planc').forEach(c=>c.classList.remove('on'));el.classList.add('on')},
  letsGo(){go(document.getElementById('camsw').classList.contains('on')?'askreg':'camoff')},
  histTab(el){S.histTab=el.dataset.v;render('history')},
  markFound(el){S.markN=+el.dataset.n;go('markfound')},
  saveFound(){const h=S.hist[S.markN];if(h){h.lost=false;h.ok=true;h.res='Found later'}toast('Marked as found');back()},
  openItem(el){S.item=S.mine.find(x=>x.id===el.dataset.id);go('item')},
  /* registration */
  regFromOnb(){S.regFrom='find';S.draft={}},
  regFromThings(){S.regFrom='things';S.draft={}},
  regAgain(){S.draft={}},
  regType(el){S.draft.k=el.dataset.k;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el))},
  voice(el){el.classList.add('rec');el.querySelector('b').textContent='Listening…';setTimeout(()=>{el.classList.remove('rec');el.querySelector('b').textContent='Voice note saved';const s=el.querySelector('span span, .grow span');const v='"I always put it there after I come home."';if(cur==='reg2'){S.draft.voice=v;el.querySelector('.grow span').textContent=v}if(cur==='editThing'){S.editVoice=v;el.querySelector('.grow span').textContent=v}},1400)},
  saveThing(){const d=S.draft;const n=(d.name||'').trim()||'New thing';const k=d.k||'other';
    S.mine.push({id:'t'+Date.now(),name:n,k,c:COLORS[S.mine.length%5],img:d.photo,spot:(d.spot||'').trim()||'Not set',last:(d.spot||'').trim()||'Not seen yet',lastT:'Just added',finds:0,avg:'—',voice:d.voice||'',top:[[(d.spot||'Its usual place'),60],['Sofa cushions',25],['Bag',15]]})},
  regDone(){if(S.regFrom==='things')go('things');else ACT.afterOnb()},
  saveOne(){const x=it();S.regFrom='find';S.draft={name:x.name,k:x.k,photo:x.img}},
  /* search */
  pickMine(el){S.item=S.mine.find(x=>x.id===el.dataset.id);selectUI(el)},
  pickOne(el){const o=ONETIME[+el.dataset.n];S.item={...o,one:true};selectUI(el)},
  mic(el){el.classList.add('rec');const c=document.getElementById('custom');c.placeholder='Listening…';later(()=>{el.classList.remove('rec');c.value='Blue umbrella';S.item={name:'Blue umbrella',k:'umbrella',c:'sky',one:true};selectUI(null)},1400)},
  recogFail(){toast("Couldn't recognize it. Try a clearer photo or a name.");back()},
  startQuick(){resetScan('quick')},
  startCalm(){resetScan('calm')},
  calmNew(){resetScan('calm')},
  resume(){S.spots=[...new Set([...S.spots,...EXTRA])];S.mode='calm'},
  toCalm(){S.mode='calm'},
  newRoom(){S.checked=new Set();S.inScan=false},
  spot(el){if(cur!=='scan')return;const id=el.dataset.id;S.checked.has(id)?S.checked.delete(id):S.checked.add(id);render('scan');
    if(S.spots.every(s=>S.checked.has(s))){later(()=>{if(S.mode==='quick'){S.mode='calm';go('autocalm')}else go('notfound')},700)}},
  markSofa(){S.checked.add('sofa')},
  markCoat(){S.checked.add('coat')},
  foundSelf(){S.foundAt=''},
  pickWhere(el){S.foundAt=el.dataset.v;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));const t=document.getElementById('whereText');if(t)t.value='';document.getElementById('whereOk').disabled=false},
  foundMatch(){S.foundAt='Under the side table'},
  markLost(){const x=it();if(!S.hist.some(h=>h.when==='Just now'&&h.name===x.name))S.hist.unshift({name:x.name,k:x.k,c:x.c,one:!!x.one,when:'Just now',res:'Truly lost',ok:false,lost:true})},
  /* check-ins */
  checkItem(el){const id=el.dataset.id,i=S.checkItems.indexOf(id);if(i>-1){if(S.checkItems.length>1){S.checkItems.splice(i,1);el.classList.remove('on')}}else{S.checkItems.push(id);el.classList.add('on')}},
  evItem(el){const id=el.dataset.id;S.evening.has(id)?S.evening.delete(id):S.evening.add(id);el.classList.toggle('on')},
  /* family */
  afterLogin(){go(S.invite?'joinFam':'find')},
  afterOnb(){go(S.invite?'joinFam':'find')},
  startInvite(){S.invite=true},
  endInvite(){S.invite=false},
  subOn(){S.sub=true},
  sendHintText(){const t=document.getElementById('hinttext');const v=t&&t.value.trim();if(!v){toast('Type a hint first');return}S.hint=v;toast('Hint sent to Dad');go('parentHint')},
  clearMissing(){},
  pickMissing(el){S.item=S.mine.find(x=>x.id===el.dataset.id);document.querySelectorAll('.pick').forEach(c=>c.classList.toggle('on',c===el));document.getElementById('findnow').disabled=false},
  editType(el){S.editK=el.dataset.k;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el))},
  saveEdit(){const x=it();const n=document.getElementById('ename').value.trim();const sp=document.getElementById('espot').value.trim();if(n)x.name=n;if(sp)x.spot=sp;if(S.editK)x.k=S.editK;if(S.editVoice)x.voice=S.editVoice;if(S.editPhoto)x.img=S.editPhoto;toast('Saved');back()},
  deleteThing(){const x=it();S.mine=S.mine.filter(m=>m!==x);S.checkItems=S.checkItems.filter(id=>id!==x.id);S.item=null;toast(`${x.name} deleted`);go('things')},
  subscribe(){S.sub=true;toast('Care plan active. Family unlocked');go('family')},
  famSel(el){S.famSel=el.dataset.id;render('family')},
  addMember(){const r=document.querySelector('#rel .chip.on');const n=r?r.textContent:'Mom';if(!S.members.some(m=>m.name===n))S.members.push({id:n.toLowerCase(),name:n,em:'🙂'});toast(`Invite sent to ${n}`);back()},
  famPeriod(el){S.famPeriod=el.dataset.v;render('family')},
  setRole(el){S.myRole=el.dataset.v;render('famRole')},
};
function selectUI(el){document.querySelectorAll('.pick,.chips .chip[data-act="pickOne"]').forEach(c=>c.classList.toggle('on',c===el));document.getElementById('cont').disabled=false}

document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){S.stack=[];if(!S.item)S.item=S.mine[0];if(!S.startTime)S.startTime=Date.now()-95000;if(j.dataset.sub)S.sub=j.dataset.sub==='1';render(j.dataset.jump);return}
  const el=e.target.closest('[data-act],[data-go],[data-back]');if(!el||el.disabled)return;
  if(el.dataset.act&&ACT[el.dataset.act])ACT[el.dataset.act](el,e);
  if(el.dataset.go)go(el.dataset.go);else if(el.hasAttribute('data-back'))back();
});
document.addEventListener('input',e=>{
  if(e.target.id==='custom'){const v=e.target.value.trim();if(v){S.item={name:v[0].toUpperCase()+v.slice(1),k:'other',c:'lav',one:true};selectUI(null)}else{S.item=null;document.getElementById('cont').disabled=true}}
  if(e.target.id==='regname')S.draft.name=e.target.value;
  if(e.target.id==='whereText'){const v=e.target.value.trim();if(v){S.foundAt=v[0].toUpperCase()+v.slice(1);document.querySelectorAll('#wh .chip').forEach(c=>c.classList.remove('on'))}document.getElementById('whereOk').disabled=!v&&!document.querySelector('#wh .chip.on')}
  if(e.target.id==='regspot')S.draft.spot=e.target.value;
});
document.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const box=e.target.closest('label');const im=document.createElement('img');im.src=r.result;box.appendChild(im);
    if(e.target.id==='file'){S.item={name:'Thing from photo',k:'photo',c:'lav',img:r.result,one:true};selectUI(null)}
    if(e.target.id==='regfile')S.draft.photo=r.result;
    if(e.target.id==='editfile')S.editPhoto=r.result};
  r.readAsDataURL(f);
});

/* nav */
(function(){const g={};Object.entries(SC).forEach(([id,s])=>{if(id==='family')return;(g[s.g]=g[s.g]||[]).push(`<button data-jump="${id}" ${id==='famLocked'?'data-sub="0"':s.g==='Family'?'data-sub="1"':''}>${s.l}</button>`)});
  document.getElementById('navlist').innerHTML=Object.entries(g).map(([k,b])=>`<h3>${k}</h3>${b.join('')}`).join('');})();
function fit(){document.documentElement.style.setProperty('--k',Math.min(1,(innerHeight-40)/844).toFixed(3))}
addEventListener('resize',fit);fit();
const fromHash=()=>{const h=location.hash.slice(1);if(SC[h]){S.stack=[];if(!S.item)S.item=S.mine[0];if(!S.startTime)S.startTime=Date.now()-95000;if(h==='famLocked')S.sub=false;else if(SC[h].g==='Family')S.sub=true;render(h);return true}return false};
addEventListener('hashchange',fromHash);if(!fromHash())render('splash');
</script>
</body>
</html>
